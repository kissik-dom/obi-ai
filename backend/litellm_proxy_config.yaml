general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
litellm_settings:
  drop_params: true
  request_timeout: 60
  num_retries: 3
  telemetry: false
  fallbacks:
  - kingdom-s-claude-3-5-sonnet:
    - kingdom-a-claude-3-opus
    - kingdom-b-claude-3-sonnet
    - kingdom-c-claude-3-haiku
  - kingdom-s-gpt-4o:
    - kingdom-a-gpt-4-turbo
    - kingdom-b-gpt-4
    - kingdom-c-gpt-4o-mini
  - kingdom-s-gemini-2-0-flash:
    - kingdom-a-gemini-1-5-pro
    - kingdom-b-gemini-1-5-flash
    - kingdom-x-gemma-2-9b-it-free
  - kingdom-s-llama-3-3-70b-instruct:
    - kingdom-b-llama-3-1-70b-instruct
    - kingdom-c-llama-3-1-8b-instruct
    - kingdom-x-llama-3-3-70b-instruct-free
  - kingdom-s-deepseek-r1:
    - kingdom-a-deepseek-chat
    - kingdom-c-deepseek-coder
    - kingdom-x-deepseek-r1-free
  - kingdom-s-qwen-2-5-72b-instruct:
    - kingdom-b-qwen-2-5-32b-instruct
    - kingdom-c-qwen-2-5-coder-32b-instruct
    - kingdom-x-qwen-2-5-72b-instruct-free
  - kingdom-s-mistral-large-2:
    - kingdom-a-mistral-large
    - kingdom-b-mixtral-8x22b-instruct
    - kingdom-c-mistral-7b-instruct
router_settings:
  routing_strategy: usage-based-routing
  num_retries: 3
  timeout: 60
  allowed_fails: 3
