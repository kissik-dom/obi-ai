# Lightweight stack: the working app (chat + documents + saved history), FREE models only.
#
# Fully self-hosted, no keys at all (open-source models run on this server):
#   docker compose -f docker-compose.simple.yml --profile local-models up -d --build
# Optional extra: a free OpenRouter account key adds the free cloud models (no credit card):
#   OPENROUTER_API_KEY=sk-or-... docker compose -f docker-compose.simple.yml --profile local-models up -d --build
# Then open http://<server-ip>:${FRONTEND_PORT:-8080}
name: kingdom-ai-os-simple
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-production}
      KAIOS_FREE_ONLY: ${KAIOS_FREE_ONLY:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-qwen2.5:3b}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      KAIOS_DEFAULT_MODEL: ${KAIOS_DEFAULT_MODEL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      KAIOS_PASSWORD_HASH: ${KAIOS_PASSWORD_HASH:-}
      KAIOS_PASSWORD: ${KAIOS_PASSWORD:-}
      KAIOS_SHIELD: ${KAIOS_SHIELD:-on}
    volumes: [kaios_data:/app/data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend: {condition: service_healthy}
    ports: ["${FRONTEND_PORT:-8080}:80"]
    restart: unless-stopped
  # Open-source model server (Ollama). Runs on CPU; uses the GPU automatically if the server has one.
  ollama:
    image: ollama/ollama:latest
    profiles: [local-models]
    volumes: [ollama_models:/root/.ollama]
    environment:  # speed: keep models in memory, faster attention, smaller cache, 2 chats at once
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_NUM_PARALLEL: "2"
      OLLAMA_MAX_LOADED_MODELS: "2"
    restart: unless-stopped
  # One-time download of the open-source models listed in OLLAMA_PULL (space separated).
  ollama-pull:
    image: ollama/ollama:latest
    profiles: [local-models]
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 5; for m in ${OLLAMA_PULL:-qwen2.5:3b llama3.2:3b}; do ollama pull $$m; done"]
    restart: "no"
volumes:
  kaios_data:
  ollama_models:
