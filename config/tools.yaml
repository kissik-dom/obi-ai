# Kingdom AI OS - Tool Registry
# Drawn from the Master Architecture Bible and arsenal docs.
# status: verified | restricted | unverified
# Only 'verified' is eligible for staging. 'restricted' needs a license/safety/rights
# review before activation. 'unverified' has no confirmed repo/license and is disabled.
# A fourth class, excluded_by_policy, is listed at the bottom and is NOT built here.

