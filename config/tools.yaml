# NOT built in this repo. Each crosses a consent, anti-abuse, or safety line that the
# Master Architecture Bible itself draws (lawful OSINT, consent-aware likeness,
# quarantined offensive models). Listed so the exclusion is explicit, not silent.
excluded_by_policy:
  - {id: netryx, reason: geolocating/identifying private people from photos}
  - {id: house-address-from-photo, reason: locating private individuals without consent}
  - {id: silent-speech-inference, reason: inferring words a person did not say aloud}
  - {id: obliteratus, reason: stripping safety guardrails as a default}
  - {id: block-evading-scrapers, reason: built to defeat sites' access controls}
  - {id: ai-detector-evasion, reason: tooling to beat AI-detection (untell/humanizer)}
  - {id: non-consensual-face-body-swap, reason: likeness of real people without consent}
