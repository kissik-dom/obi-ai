name: Deploy Kingdom AI OS (staging) to Vultr

# Runs the free-models Kingdom AI OS from the `staging` branch on the same Vultr
# server, NEXT TO the existing Obi AI app (separate folder ~/kaios-app, separate
# Docker project "kaios", its own port). It never touches /opt/obi-ai or port 3000.
on:
  push:
    branches: [staging]
    paths: ["kingdom-ai-os/**", ".github/workflows/deploy-kaios-staging.yml"]
  workflow_dispatch:

concurrency:
  group: vultr-kaios-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST || secrets.SERVER_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST" || { echo "SERVER_HOST is missing" >&2; exit 1; }
          test -n "$SSH_USERNAME" || { echo "SSH_USERNAME is missing" >&2; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "SSH_PRIVATE_KEY is missing" >&2; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/k"
          chmod 600 "$HOME/.ssh/k"
          ssh-keygen -y -f "$HOME/.ssh/k" >/dev/null
          ssh-keyscan -H "$SERVER_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null

      - name: Package kingdom-ai-os
        run: git archive --format=tar.gz -o "$RUNNER_TEMP/kaios.tar.gz" "HEAD:kingdom-ai-os"

      - name: Copy to server
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST || secrets.SERVER_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: scp -i "$HOME/.ssh/k" -o BatchMode=yes "$RUNNER_TEMP/kaios.tar.gz" "${SSH_USERNAME}@${SERVER_HOST}:/tmp/kaios-${GITHUB_SHA}.tar.gz"

      - name: Deploy, pull free models, smoke-test
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST || secrets.SERVER_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/k" -o BatchMode=yes -o ServerAliveInterval=30 "${SSH_USERNAME}@${SERVER_HOST}" "SHA='${GITHUB_SHA}' bash -s" <<'REMOTE'
          set -euo pipefail
          if docker info >/dev/null 2>&1; then D=(docker); else D=(sudo -n docker); fi
          echo "== Server specs =="
          nproc; free -h; df -h / | tail -1
          command -v nvidia-smi >/dev/null && nvidia-smi --query-gpu=name,memory.total --format=csv || echo "GPU: none"
          AVAIL_GB=$(awk '/MemAvailable/ {printf "%d", $2/1048576}' /proc/meminfo)
          DISK_GB=$(df -BG --output=avail / | tail -1 | tr -dc 0-9)
          echo "available RAM GB=$AVAIL_GB  free disk GB=$DISK_GB"
          if   [ "$AVAIL_GB" -ge 12 ] && [ "$DISK_GB" -ge 20 ]; then PULL="qwen2.5:3b llama3.2:3b qwen2.5:7b"; DEF="qwen2.5:7b"
          elif [ "$AVAIL_GB" -ge 5 ]  && [ "$DISK_GB" -ge 10 ]; then PULL="qwen2.5:3b llama3.2:3b"; DEF="qwen2.5:3b"
          elif [ "$AVAIL_GB" -ge 3 ]  && [ "$DISK_GB" -ge 6 ];  then PULL="qwen2.5:3b"; DEF="qwen2.5:3b"
          else PULL="qwen2.5:1.5b"; DEF="qwen2.5:1.5b"; fi
          PORT=8080
          if (ss -ltn 2>/dev/null || true) | grep -q ':8080 ' && ! "${D[@]}" ps --format '{{.Names}} {{.Ports}}' | grep -q 'kaios.*8080'; then PORT=8090; fi
          echo "models: $PULL (default $DEF)  port: $PORT"

          APP="$HOME/kaios-app"
          mkdir -p "$APP.new" && tar -xzf "/tmp/kaios-${SHA}.tar.gz" -C "$APP.new"
          printf 'OLLAMA_PULL=%s\nOLLAMA_DEFAULT_MODEL=%s\nFRONTEND_PORT=%s\nKAIOS_FREE_ONLY=true\n' "$PULL" "$DEF" "$PORT" > "$APP.new/.env"
          [ -f "$APP/.env.local" ] && cat "$APP/.env.local" >> "$APP.new/.env" && cp "$APP/.env.local" "$APP.new/" || true
          rm -rf "$APP.old"; [ -d "$APP" ] && mv "$APP" "$APP.old"; mv "$APP.new" "$APP"
          cd "$APP"
          "${D[@]}" compose -p kaios -f docker-compose.simple.yml --profile local-models up -d --build
          echo "== Waiting for model download (can take several minutes) =="
          for i in $(seq 1 120); do
            st=$("${D[@]}" inspect -f '{{.State.Status}} {{.State.ExitCode}}' kaios-ollama-pull-1 2>/dev/null || echo "missing 0")
            case "$st" in exited*) echo "pull finished: $st"; break;; esac; sleep 10
          done
          "${D[@]}" logs --tail=5 kaios-ollama-pull-1 2>&1 | tr '\r' '\n' | tail -5 || true
          sudo -n ufw status 2>/dev/null | grep -q "Status: active" && sudo -n ufw allow "$PORT"/tcp || true
          echo "== Status =="
          for i in $(seq 1 30); do curl -fsS "http://127.0.0.1:$PORT/api/v1/status" && break; sleep 5; done; echo
          echo "== Live chat test =="
          CID=$(curl -fsS -X POST "http://127.0.0.1:$PORT/api/v1/conversations" -H 'content-type: application/json' -d '{"tab_id":"home","title":"deploy smoke test"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])' || echo none)
          curl -sS -m 300 -X POST "http://127.0.0.1:$PORT/api/v1/conversations/$CID/messages" -H 'content-type: application/json' -d '{"content":"Reply with one short friendly sentence confirming you are online."}' | head -c 1500 || true; echo
          "${D[@]}" compose -p kaios ps
          rm -f "/tmp/kaios-${SHA}.tar.gz"; rm -rf "$APP.old"
          echo "KAIOS_PORT=$PORT"
          REMOTE

      - name: Check it is reachable from the internet
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST || secrets.SERVER_HOST }}
        run: |
          for p in 8080 8090; do
            if curl -fsS -m 10 "http://$SERVER_HOST:$p/healthz"; then echo "PUBLIC_OK port $p"; exit 0; fi
          done
          echo "NOT reachable from the internet - open the port in the Vultr firewall"
