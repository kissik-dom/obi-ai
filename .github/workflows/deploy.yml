name: Provision on Vultr GPU Cloud (API only)

on:
  workflow_dispatch:
    inputs:
      git_branch:
        description: Git branch to clone during Vultr cloud-init
        required: true
        default: arena/41e9ebf0-obi-ai
        type: string

jobs:
  test-before-provision:
    uses: ./.github/workflows/test.yml

  provision-vultr:
    needs: test-before-provision
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the requested branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_branch }}

      - name: Provision Vultr instance through the Vultr API
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          VULTR_REGION: ${{ vars.VULTR_REGION || 'ewr' }}
          VULTR_PLAN: ${{ vars.VULTR_PLAN || 'vcg-a100-1c-8g-40vram' }}
          VULTR_OS_ID: ${{ vars.VULTR_OS_ID || '1743' }}
          GITHUB_BRANCH: ${{ inputs.git_branch }}
        run: |
          set -euo pipefail
          test -n "${VULTR_API_KEY}" || {
            echo "VULTR_API_KEY is required in GitHub Actions secrets." >&2
            exit 1
          }
          chmod +x ./vultr_deploy.sh
          ./vultr_deploy.sh --provision
