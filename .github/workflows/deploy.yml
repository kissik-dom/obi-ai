name: Deploy OBI-AI to existing server (SSH)

on:
  workflow_dispatch:
    inputs:
      git_branch:
        description: Git branch to deploy
        required: true
        default: arena/41e9ebf0-obi-ai
        type: string

jobs:
  test-before-deploy:
    uses: ./.github/workflows/test.yml

  deploy-server:
    needs: test-before-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install and validate SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)"
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" | tr -d '\r' > "${HOME}/.ssh/deploy_key"
          chmod 600 "${HOME}/.ssh/deploy_key"
          ssh-keygen -y -f "${HOME}/.ssh/deploy_key" >/dev/null || {
            echo "SSH_PRIVATE_KEY is not a valid OpenSSH private key. Do not use the .pub file or a PuTTY .ppk file." >&2
            exit 1
          }
          ssh-add "${HOME}/.ssh/deploy_key"

      - name: Deploy selected branch over SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SSH_USERNAME }}
          GITHUB_BRANCH: ${{ inputs.git_branch }}
        run: |
          set -euo pipefail
          test -n "${SERVER_HOST}" || { echo "SERVER_HOST is required." >&2; exit 1; }
          test -n "${SERVER_USER}" || { echo "SERVER_USER is required." >&2; exit 1; }
          ssh -o StrictHostKeyChecking=accept-new "${SERVER_USER}@${SERVER_HOST}" bash -s -- "${GITHUB_BRANCH}" <<'REMOTE_SCRIPT'
          set -euo pipefail
          BRANCH="$1"
          REPO_URL="https://github.com/kissik-dom/obi-ai.git"
          APP_DIR="${HOME}/kingdom-ai-os"

          if [ -d "${APP_DIR}/.git" ]; then
            cd "${APP_DIR}"
            git fetch --depth=1 origin "${BRANCH}"
            git checkout -B "${BRANCH}" FETCH_HEAD
          else
            rm -rf "${APP_DIR}"
            git clone --depth=1 --branch "${BRANCH}" "${REPO_URL}" "${APP_DIR}"
            cd "${APP_DIR}"
          fi

          chmod +x ./vultr_deploy.sh
          GITHUB_REPO="kissik-dom/obi-ai" GITHUB_BRANCH="${BRANCH}" ./vultr_deploy.sh
          REMOTE_SCRIPT
