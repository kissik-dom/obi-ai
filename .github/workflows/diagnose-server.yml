name: Diagnose existing OBI-AI server (read-only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Install and validate SSH key
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST || secrets.SERVER_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST" && test -n "$SSH_USERNAME" && test -n "$SSH_PRIVATE_KEY"
          [[ "$SERVER_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$SSH_USERNAME" =~ ^[A-Za-z0-9._-]+$ ]]
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/obi_deploy_key"
          chmod 600 "$HOME/.ssh/obi_deploy_key"
          ssh-keygen -y -f "$HOME/.ssh/obi_deploy_key" >/dev/null
          ssh-keyscan -H "$SERVER_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect Compose and backend health (read-only)
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST || secrets.SERVER_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/obi_deploy_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${SSH_USERNAME}@${SERVER_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/kingdom-ai-os"
          echo '--- Compose service status ---'
          docker-compose -p kingdom-ai-os ps || true
          CID="$(docker-compose -p kingdom-ai-os ps -q backend 2>/dev/null | head -n 1 || true)"
          if [ -n "$CID" ]; then
            echo '--- Backend container and health status ---'
            docker inspect --format 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$CID"
            docker inspect --format '{{range .State.Health.Log}}{{printf "%s exit=%d output=%q\n" .Start .ExitCode .Output}}{{end}}' "$CID" | tail -10
            echo '--- Redacted backend error lines ---'
            docker logs --tail=160 "$CID" 2>&1 | python3 -c '
          import re, sys
          lines = list(sys.stdin)
          keep = re.compile(r"\b(ERROR|CRITICAL|Traceback|Exception|ModuleNotFoundError|ImportError|OperationalError|ConnectionRefused|FATAL)\b", re.I)
          selected = [line for line in lines if keep.search(line)]
          scrubbers = [
              (r"(?i)(authorization\s*[:=]\s*bearer\s+)[^\s,;]+", r"\1[REDACTED]"),
              (r"(?i)(\b(?:password|passwd|token|secret|api[_-]?key)\b\s*[:=]\s*)[^\s,;]+", r"\1[REDACTED]"),
              (r"sk-[A-Za-z0-9_-]{12,}", "[REDACTED_KEY]"),
              (r"(://[^:/\s]+:)[^@/\s]+(@)", r"\1[REDACTED]\2"),
          ]
          if not selected:
              print("No matching error lines in the last 160 backend log lines.")
          for line in selected[-60:]:
              for pattern, replacement in scrubbers:
                  line = re.sub(pattern, replacement, line)
              print(line[:1200], end="")
          '
          else
            echo 'Backend container not found.'
          fi
          REMOTE
