services:
  - type: web
    name: kingdom-ai-os
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8000"
      - key: KINGDOM_INTERNAL_SECRET
        generateValue: true
      - key: LITELLM_MASTER_KEY
        generateValue: true
      - key: VAULT_TOKEN
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY_1
        sync: false
