x-kingdom-common: &kingdom-common
  restart: unless-stopped

x-health-default: &health-default
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 20s

services:
  frontend:
    <<: *kingdom-common
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://backend:8000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173 >/dev/null || exit 1"]
      <<: *health-default
    networks:
      - kingdom
    depends_on:
      - backend

  backend:
    <<: *kingdom-common
    image: python:3.12-slim
    working_dir: /srv
    volumes:
      - .:/srv
      - kingdom-finished:/var/lib/kingdom/finished
      - kingdom-requests:/var/lib/kingdom/requests
    command: sh -c "pip install -r backend/requirements.txt && uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
      VAULT_ADDR: http://vault:8200
      DATABASE_URL: postgresql+psycopg://kingdom:kingdom@postgres:5432/kingdom
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      LITELLM_MASTER_KEY: change-me-in-vault
      FINISHED_FOLDER: /var/lib/kingdom/finished
      REQUESTS_FOLDER: /var/lib/kingdom/requests
      FLAG_QDRANT: "1"
      FLAG_MINIO: "1"
      FLAG_VAULT: "1"
      FLAG_POSTGRES: "1"
      FLAG_REDIS: "1"
      FLAG_CUA_FLEET: "1"
      FLAG_GPU_WORKERS: "1"
      FLAG_SECURITY_STACK: "1"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)\" || exit 1"]
      <<: *health-default
    networks:
      - kingdom
    depends_on:
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  qdrant:
    <<: *kingdom-common
    image: qdrant/qdrant:v1.12.6
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      <<: *health-default
    networks:
      - kingdom

  minio:
    <<: *kingdom-common
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: kingdom_minio
      MINIO_ROOT_PASSWORD: change-me-in-vault
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -f http://127.0.0.1:9000/minio/health/live || exit 1"]
      <<: *health-default
    networks:
      - kingdom

  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-25Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set kingdom http://minio:9000 kingdom_minio change-me-in-vault &&
             mc mb -p kingdom/kingdom-sandboxes kingdom/kingdom-finished kingdom/kingdom-knowledge 2>/dev/null || true"
    networks:
      - kingdom

  vault:
    <<: *kingdom-common
    image: hashicorp/vault:1.18.3
    cap_add:
      - IPC_LOCK
    ports:
      - "127.0.0.1:8200:8200"
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_ROOT_TOKEN: ${VAULT_ROOT_TOKEN:-kingdom-root-change-me}
      VAULT_UNSEAL_KEY: ${VAULT_UNSEAL_KEY:-}
    command: server -config=/vault/config/config.hcl
    volumes:
      - ./vault/config.hcl:/vault/config/config.hcl:ro
      - vault-data:/vault/file
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200 >/dev/null 2>&1 || exit 1"]
      <<: *health-default
    networks:
      - kingdom

  vault-init:
    image: hashicorp/vault:1.18.3
    restart: "no"
    depends_on:
      vault:
        condition: service_started
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_ROOT_TOKEN: ${VAULT_ROOT_TOKEN:-kingdom-root-change-me}
    entrypoint: ["/bin/sh", "/vault/bootstrap.sh"]
    volumes:
      - ./vault/bootstrap.sh:/vault/bootstrap.sh:ro
      - vault-data:/vault/file
    networks:
      - kingdom

  litellm:
    <<: *kingdom-common
    image: ghcr.io/berriai/litellm:main-v1.57.5
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./backend/litellm_proxy_config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-change-me-in-vault}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:4000/health/liveliness || exit 1"]
      <<: *health-default
    networks:
      - kingdom

  postgres:
    <<: *kingdom-common
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: kingdom
      POSTGRES_USER: kingdom
      POSTGRES_PASSWORD: kingdom
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kingdom -d kingdom"]
      <<: *health-default
    networks:
      - kingdom

  redis:
    <<: *kingdom-common
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *health-default
    networks:
      - kingdom

  cua-fleet:
    <<: *kingdom-common
    image: ghcr.io/kingdom/cua-fleet:1.0.0
    deploy:
      replicas: 5
    ports:
      - "2000-2004:2000"
    environment:
      CUA_SPACE_PORTS: "2000,2001,2002,2003,2004"
      CUA_ISOLATION_MODE: strict
      CUA_HOST: 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:2000/healthz', timeout=5)\" || exit 1"]
      <<: *health-default
    networks:
      - kingdom
      - cua-isolated
    profiles:
      - cua

  gpu-workers:
    <<: *kingdom-common
    image: ghcr.io/kingdom/gpu-worker:1.0.0
    deploy:
      replicas: 5
    ports:
      - "200-204:200"
    environment:
      GPU_WORKER_PORTS: "200,201,202,203,204"
      VRAM_BUDGET_GB: "12"
      NVIDIA_VISIBLE_DEVICES: all
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:200/healthz', timeout=5)\" || exit 1"]
      <<: *health-default
    networks:
      - kingdom
      - gpu-isolated
    profiles:
      - gpu

  crowdsec:
    <<: *kingdom-common
    image: crowdsecurity/crowdsec:v1.6.4
    volumes:
      - crowdsec-config:/etc/crowdsec
      - crowdsec-db:/var/lib/crowdsec/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "cscli metrics >/dev/null 2>&1 || exit 1"]
      <<: *health-default
    networks:
      - kingdom
    profiles:
      - security

  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.9.0
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - wazuh-indexer:/usr/share/wazuh-indexer/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9200 >/dev/null || exit 1"]
      <<: *health-default
    networks:
      - kingdom
    profiles:
      - security

  wazuh-manager:
    image: wazuh/wazuh-manager:4.9.0
    ports:
      - "1514:1514/udp"
      - "1515:1515/tcp"
    volumes:
      - wazuh-manager:/var/ossec/data
    healthcheck:
      test: ["CMD-SHELL", "/var/ossec/bin/wazuh-control status >/dev/null 2>&1 || exit 1"]
      <<: *health-default
    networks:
      - kingdom
    profiles:
      - security

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.9.0
    ports:
      - "443:5601"
    environment:
      INDEXER_URL: https://wazuh-indexer:9200
      WAZUH_API_URL: https://wazuh-manager:55000
    healthcheck:
      test: ["CMD-SHELL", "curl -f -k https://127.0.0.1:5601 >/dev/null || exit 1"]
      <<: *health-default
    networks:
      - kingdom
    profiles:
      - security

  suricata:
    image: jasonish/suricata:7.0.7
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - suricata-logs:/var/log/suricata
      - ./vultr/suricata:/etc/suricata:ro
    command: -i eth0
    healthcheck:
      test: ["CMD-SHELL", "pgrep suricata >/dev/null || exit 1"]
      <<: *health-default
    profiles:
      - security

  falco:
    image: falcosecurity/falco:0.39.0
    privileged: true
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - /dev:/host/dev
      - /proc:/host/proc:ro
      - /boot:/host/boot:ro
      - /lib/modules:/host/lib/modules:ro
      - /usr:/host/usr:ro
    command: falco
    healthcheck:
      test: ["CMD-SHELL", "pgrep falco >/dev/null || exit 1"]
      <<: *health-default
    profiles:
      - security

  tetragon:
    image: quay.io/cilium/tetragon:v1.1.2
    privileged: true
    pid: host
    volumes:
      - /sys/kernel/btf/vmlinux:/var/lib/tetragon/btf:ro
      - tetragon-export:/var/run/cilium
    command: /usr/bin/tetragon --bpf-lib /var/lib/tetragon
    healthcheck:
      test: ["CMD-SHELL", "pgrep tetragon >/dev/null || exit 1"]
      <<: *health-default
    profiles:
      - security

  cowrie:
    image: cowrie/cowrie:2.6.1
    ports:
      - "2222:2222"
    volumes:
      - cowrie-data:/cowrie/cowrie-git/var
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1',2222), timeout=2).close()\" || exit 1"]
      <<: *health-default
    networks:
      - kingdom
    profiles:
      - security

  compreface:
    image: exadel/compreface:1.4.1
    ports:
      - "8001:8080"
    volumes:
      - compreface-data:/var/lib/compreface
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health || exit 1"]
      <<: *health-default
    networks:
      - kingdom
    profiles:
      - security

  wireguard:
    image: linuxserver/wireguard:1.0.20210914
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      SERVERURL: wireguard.${DOMAIN:-localhost}
      SERVERPORT: "51820"
      PEERS: "1"
      PEERDNS: auto
    volumes:
      - wireguard-config:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    healthcheck:
      test: ["CMD-SHELL", "wg show >/dev/null 2>&1 || exit 1"]
      <<: *health-default
    networks:
      - kingdom
    profiles:
      - security

networks:
  kingdom:
    driver: bridge
  cua-isolated:
    driver: bridge
    internal: true
  gpu-isolated:
    driver: bridge

volumes:
  qdrant-data:
  minio-data:
  postgres-data:
  redis-data:
  vault-data:
  kingdom-finished:
  kingdom-requests:
  crowdsec-config:
  crowdsec-db:
  wazuh-indexer:
  wazuh-manager:
  suricata-logs:
  tetragon-export:
  cowrie-data:
  compreface-data:
  wireguard-config:
