services:
  qdrant:
    image: qdrant/qdrant:v1.7.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2024-03-15T01-07-19Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  vault:
    image: hashicorp/vault:1.15
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    restart: always
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kingdom}
      POSTGRES_USER: ${POSTGRES_USER:-kingdom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kingdom123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kingdom} -d ${POSTGRES_DB:-kingdom}"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  litellm:
    image: ghcr.io/berriai/litellm:main-v1.36.0
    ports:
      - "4000:4000"
    env_file:
      - .env.example
    volumes:
      - ./backend/litellm_proxy_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/health/liveliness"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      target: base
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    depends_on:
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - finished_data:/data/finished
      - requests_data:/data/requests
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  celery-worker:
    build:
      context: ./backend
      target: base
    env_file:
      - .env.example
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: celery -A backend.tasks.celery_app worker --loglevel=info
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.tasks.celery_app status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  celery-beat:
    build:
      context: ./backend
      target: base
    env_file:
      - .env.example
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A backend.tasks.celery_app beat --loglevel=info
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3

  flower:
    build:
      context: ./backend
      target: base
    ports:
      - "5555:5555"
    env_file:
      - .env.example
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A backend.tasks.celery_app flower --port=5555
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5555/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:10.4.1
    ports:
      - "3001:3000"
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  loki:
    image: grafana/loki:2.9.6
    ports:
      - "3100:3100"
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 3

  watchtower:
    image: containrrr/watchtower:1.7.1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 30 --cleanup
    restart: always
    healthcheck:
      test: ["CMD", "/watchtower", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 3

  keel:
    image: keelhq/keel:0.19.1
    ports:
      - "9300:9300"
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9300/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  bugfix-agent:
    build:
      context: ./backend
      target: base
    env_file:
      - .env.example
    depends_on:
      backend:
        condition: service_healthy
    command: python -m agents.bugfix_agent
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://backend:8000/api/bugfix/status"]
      interval: 10s
      timeout: 5s
      retries: 3

  testing-agent:
    build:
      context: ./backend
      target: base
    env_file:
      - .env.example
    depends_on:
      backend:
        condition: service_healthy
    command: python -m agents.testing_agent
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://backend:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  qdrant_data:
  minio_data:
  postgres_data:
  redis_data:
  finished_data:
  requests_data:
