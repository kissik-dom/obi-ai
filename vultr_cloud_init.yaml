#cloud-config
# Kingdom AI OS - Browser-Only Vultr Cloud-Init (Zero SSH Required!)
# Paste this file into the "Cloud-Init User-Data" box when clicking Deploy on my.vultr.com
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - jq
  - python3
  - python3-venv
  - ufw
  - wireguard
  - wireguard-tools

runcmd:
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update && apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 5173/tcp
  - ufw allow 8000/tcp
  - ufw allow 51820/udp
  - ufw --force enable
  - git clone -b __GITHUB_BRANCH__ https://github.com/kissik-dom/obi-ai.git /opt/kingdom-ai-os || git clone https://github.com/kissik-dom/obi-ai.git /opt/kingdom-ai-os
  - cd /opt/kingdom-ai-os && chmod +x quickstart_setup.sh && ./quickstart_setup.sh
