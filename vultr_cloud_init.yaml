#cloud-config
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - git
  - gnupg
  - lsb-release
  - ufw
  - wireguard

write_files:
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }

runcmd:
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" > /etc/apt/sources.list.d/docker.list
  - curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | gpg --dearmor -o /etc/apt/keyrings/nvidia-container-toolkit-keyring.gpg
  - curl -fsSL https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | sed 's#deb https://#deb [signed-by=/etc/apt/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' > /etc/apt/sources.list.d/nvidia-container-toolkit.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin nvidia-container-toolkit
  - systemctl enable --now docker
  - ufw default deny incoming
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 51820/udp
  - ufw --force enable
  # Set GITHUB_DEPLOY_TOKEN to a deploy token (or PAT) before running this.
  - |
    GITHUB_DEPLOY_TOKEN="${GITHUB_DEPLOY_TOKEN:-}"
    if [ -n "${GITHUB_DEPLOY_TOKEN}" ]; then
      git clone "https://x-access-token:${GITHUB_DEPLOY_TOKEN}@github.com/kissik-dom/obi-ai.git" /opt/kingdom
    else
      git clone https://github.com/kissik-dom/obi-ai.git /opt/kingdom
    fi
  - cd /opt/kingdom && cp .env.example .env
  - docker compose -f docker-compose.yml up -d
  - docker compose -f docker-compose.yml --profile security up -d
final_message: "Kingdom AI OS cloud-init complete."
