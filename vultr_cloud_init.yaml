#cloud-config
# Kingdom AI OS - Vultr GPU A100 Ubuntu 24.04 LTS Cloud-Init Bootstrap
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - jq
  - ufw
  - wireguard
  - wireguard-tools
  - linux-headers-generic

runcmd:
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
  - curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' > /etc/apt/sources.list.d/nvidia-container-toolkit.list
  - apt-get update && apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin nvidia-container-toolkit
  - nvidia-ctk runtime configure --runtime=docker
  - systemctl enable --now docker
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 5173/tcp
  - ufw allow 8000/tcp
  - ufw allow 51820/udp
  - ufw --force enable
  - mkdir -p /opt/kingdom-ai-os
  - git clone https://github.com/YOURNAME/kingdom-ai-os.git /opt/kingdom-ai-os || true
  - cd /opt/kingdom-ai-os && cp -n .env.example .env || true
  - cd /opt/kingdom-ai-os && docker compose -f docker-compose.yml -f vultr_security_docker-compose.yml -f vultr_gpu_docker-compose.override.yml up -d --build || true
